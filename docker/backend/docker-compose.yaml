version: '3.8'

services:
  backend:
    build: 
      context: ../../
      dockerfile: docker/backend/Dockerfile 
    container_name: smarthome-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Пробрасываем код для hot-reload
      - ../../:/app
      # Изолируем виртуальное окружение контейнера от хоста
      - /app/.venv
    # extra_hosts:
      # - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
      # Переменные для подключения к другим контейнерам
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 
    # Если kafka описана в другом compose, укажите внешнюю сеть ниже
    networks:
      - smarthome-network
